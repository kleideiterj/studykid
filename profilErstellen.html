<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Registrierung</title>

    <link rel="stylesheet" href="assets/css/navigation.css">
    <link rel="stylesheet" href="assets/css/anmelden.css">
</head>

<body>

    <header>
        <p>
            <a href="startseite.html">
                <img src="./assets/img/studybox-hut-logo.png" alt="StudyBox - Digitale Starterpakete für Studenten"
                    width="80">
            </a>
        </p>

        <nav aria-label="Hauptnavigation">
            <ul>
                <li><a href="startseite.html" aria-current="page">Übersicht</a></li>
                <li><a href="produkte.html">Produkte</a></li>
                <li><a href="studentenrabatt.html">Studentenrabatt</a></li>
                <li><a href="profilAnmelden.html"> <img src="./assets/img/Profil.png" alt="Mein Profil" width="50"
                            title="Mein Profil"></a></li>
                <li><a href="Warenkorb.html"><img src="./assets/img/warenkorb.png" alt="Warenkorb" width="50"
                            title="Warenkorb"></a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Registrierung</h1>

        <form>

            <div>
                <input type="text" placeholder="Vorname">
                <input type="text" placeholder="Nachname">
            </div>

            <br>

            <label for="land">Land/Region:</label>
            <br>

            <select id="land" name="land">
                <option>Bitte wählen</option>
                <option>Deutschland</option>
                <option>Österreich</option>
                <option>Schweiz</option>
                <option>Frankreich</option>
                <option>Italien</option>
                <option>Spanien</option>
                <option>USA</option>
                <option>Vereinigtes Königreich</option>
            </select>

            <br><br>

            <label>Geburtsdatum:</label>
            <br>

            <input type="date" min="1950-01-01" max="2026-12-31">

            <br><br>

            <hr>

            <br>

            <input type="email" placeholder="E-Mail">

            <br>

            <input type="password" placeholder="Passwort">

            <br>

            <input type="password" placeholder="Passwort bestätigen">

            <br><br>

            <hr>

            <br>

            <label>Ländervorwahl:</label>

            <br>

            <select>
                <option>+49 (Deutschland)</option>
                <option>+43 (Österreich)</option>
                <option>+41 (Schweiz)</option>
                <option>+33 (Frankreich)</option>
                <option>+39 (Italien)</option>
                <option>+34 (Spanien)</option>
                <option>+1 (USA)</option>
                <option>+44 (Vereinigtes Königreich)</option>
            </select>

            <br>

            <input type="tel" placeholder="Telefonnummer">

            <br><br><br>

            <button type="submit">
                Konto erstellen
            </button>

        </form>

        <br><br>

        <p>Bereits registriert?</p>

        <a href="profilAnmelden.html">
            Zur Anmeldung
        </a>

    </main>

    <footer>

        <hr>

        <nav aria-label="Footer">
            <ul>
                <li><a href="ueber.html">Über uns</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="impressum.html">Impressum</a></li>
                <li><a href="datenschutz.html">Datenschutz</a></li>
            </ul>
        </nav>

        <p>
            <img src="./assets/img/studybox-logo-weiss.png" alt="StudyBox - Digitale Starterpakete für Studenten"
                width="80">
        </p>

    </footer>

</body>

</html>
