<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Registrierung</title>

    <link rel="stylesheet" href="../../assets/css/basic.css">
    <link rel="stylesheet" href="../../assets/css/anmelden.css">
</head>

<body>

    <header>
        <p><a href="../../index.html"><img src="../../assets/img/studybox-hut-logo.png" alt="StudyBox – zur Startseite"
                    width="80"></a></p>
        <nav aria-label="Hauptnavigation">
            <ul>
                <li><a href="../../index.html" aria-current="page">Übersicht</a></li>
                <li><a href="../bundles/bundle.html">Bundles</a></li>
                <li><a href="../warenkorb/studentenrabatt.html">Studentenrabatt</a></li>
                <li><a href="../konto/profilAnmelden.html"> <img src="../../assets/img/profil.png" alt="Mein Profil"
                            width="50" title="Mein Profil"></a></li>
                <li><a href="../warenkorb/warenkorb.html"><img src="../../assets/img/warenkorb.png" alt="Warenkorb"
                            width="50" title="Warenkorb"></a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Registrierung</h1>

        <form>

            <div>
                <input type="text" placeholder="Vorname">
                <input type="text" placeholder="Nachname">
            </div>

            <br>

            <label for="land">Land/Region:</label>
            <br>

            <select id="land" name="land">
                <option>Bitte wählen</option>
                <option>Deutschland</option>
                <option>Österreich</option>
                <option>Schweiz</option>
                <option>Frankreich</option>
                <option>Italien</option>
                <option>Spanien</option>
                <option>USA</option>
                <option>Vereinigtes Königreich</option>
            </select>

            <br><br>

            <label>Geburtsdatum:</label>
            <br>

            <input type="date" min="1950-01-01" max="2026-12-31">

            <br><br>

            <hr>

            <br>

            <input type="email" placeholder="E-Mail">

            <br>

            <input type="password" placeholder="Passwort">

            <br>

            <input type="password" placeholder="Passwort bestätigen">

            <br><br>

            <hr>

            <br>

            <label>Ländervorwahl:</label>

            <br>

            <select>
                <option>+49 (Deutschland)</option>
                <option>+43 (Österreich)</option>
                <option>+41 (Schweiz)</option>
                <option>+33 (Frankreich)</option>
                <option>+39 (Italien)</option>
                <option>+34 (Spanien)</option>
                <option>+1 (USA)</option>
                <option>+44 (Vereinigtes Königreich)</option>
            </select>

            <br>

            <input type="tel" placeholder="Telefonnummer">

            <br><br><br>

        <a href="" class="kasse-btn">
                            <button>Konto erstellen</button>
                        </a>
               
            

        </form>

        <br><br>

        <p>Bereits registriert?</p>

        <a href="profilAnmelden.html">
            Zur Anmeldung
        </a>

    </main>

    <footer>
        <hr>
        <nav aria-label="Footer">
            <ul>
                <li><a href="../footer/ueber.html">Über uns</a></li>
                <li><a href="../footer/faq.html">FAQ</a></li>
                <li><a href="../footer/impressum.html">Impressum</a></li>
                <li><a href="../footer/datenschutz.html">Datenschutz</a></li>
            </ul>
        </nav>
        <p><img src="../../assets/img/studybox-logo-weiss.png" alt="StudyBox - Digitale Starterpakete für Studenten"
                width="80"></p>
    </footer>

</body>

</html>
