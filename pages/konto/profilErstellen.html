
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung</title>
    <meta name="description" content="Erstelle dein persönliches StudyBox-Konto.">

    <link rel="stylesheet" href="../../assets/css/basic.css">
    <link rel="stylesheet" href="../../assets/css/anmelden.css">
</head>

<body>

    <a class="skip-link" href="#hauptinhalt">Zum Hauptinhalt springen</a>

    <header>
        <p><a href="../../index.html"><img src="../../assets/img/studybox-hut-logo.png" alt="StudyBox – zur Startseite"
                    width="80"></a></p>
        <nav aria-label="Hauptnavigation">
            <ul>
                <li><a href="../../index.html">Übersicht</a></li>
                <li><a href="../bundles/bundle.html">Bundles</a></li>
                <li><a href="../warenkorb/studentenrabatt.html">Studentenrabatt</a></li>
                <li><a href="../konto/profilAnmelden.html">
                    <img src="../../assets/img/profil.png" alt="Mein Profil"
                        width="50" title="Mein Profil"></a></li>
                <li><a href="../warenkorb/warenkorb.html">
                    <img src="../../assets/img/warenkorb.png" alt="Warenkorb"
                        width="50" title="Warenkorb"></a></li>
            </ul>
        </nav>
    </header>

    <main id="hauptinhalt">

        <h1>Registrierung</h1>

        <form>

            <div>
                <label for="vorname" class="visually-hidden">Vorname</label>
                <input type="text" id="vorname" name="vorname"
                    placeholder="Vorname" autocomplete="given-name" required>

                <label for="nachname" class="visually-hidden">Nachname</label>
                <input type="text" id="nachname" name="nachname"
                    placeholder="Nachname" autocomplete="family-name" required>
            </div>

            <br>

            <label for="land">Land/Region:</label>
            <br>

            <select id="land" name="land">
                <option value="">Bitte wählen</option>
                <option>Deutschland</option>
                <option>Österreich</option>
                <option>Schweiz</option>
                <option>Frankreich</option>
                <option>Italien</option>
                <option>Spanien</option>
                <option>USA</option>
                <option>Vereinigtes Königreich</option>
            </select>

            <br><br>

            <label for="geburtsdatum">Geburtsdatum:</label>
            <br>

            <input type="date" id="geburtsdatum" name="geburtsdatum"
                min="1950-01-01" max="2026-12-31">

            <br><br>

            <hr>

            <br>

            <label for="email" class="visually-hidden">E-Mail-Adresse</label>
            <input type="email" id="email" name="email"
                placeholder="E-Mail" autocomplete="email" required>

            <br>

            <label for="passwort" class="visually-hidden">Passwort</label>
            <input type="password" id="passwort" name="passwort"
                placeholder="Passwort" autocomplete="new-password" required>

            <br>

            <label for="passwort-bestaetigen" class="visually-hidden">
                Passwort bestätigen
            </label>
            <input type="password" id="passwort-bestaetigen"
                name="passwort-bestaetigen"
                placeholder="Passwort bestätigen"
                autocomplete="new-password" required>

            <br><br>

            <hr>

            <br>

            <label for="vorwahl">Ländervorwahl:</label>

            <br>

            <select id="vorwahl" name="vorwahl">
                <option value="+49">+49 (Deutschland)</option>
                <option value="+43">+43 (Österreich)</option>
                <option value="+41">+41 (Schweiz)</option>
                <option value="+33">+33 (Frankreich)</option>
                <option value="+39">+39 (Italien)</option>
                <option value="+34">+34 (Spanien)</option>
                <option value="+1">+1 (USA)</option>
                <option value="+44">+44 (Vereinigtes Königreich)</option>
            </select>

            <br>

            <label for="telefon" class="visually-hidden">Telefonnummer</label>
            <input type="tel" id="telefon" name="telefon"
                placeholder="Telefonnummer" autocomplete="tel">

            <br><br><br>

            <button type="submit" class="kasse-btn">Konto erstellen</button>

        </form>

        <br><br>

        <p>Bereits registriert?</p>

        <a href="profilAnmelden.html">
            Zur Anmeldung
        </a>

    </main>

    <footer>
        <hr>
        <nav aria-label="Footer">
            <ul>
                <li><a href="../footer/ueber.html">Über uns</a></li>
                <li><a href="../footer/faq.html">FAQ</a></li>
                <li><a href="../footer/impressum.html">Impressum</a></li>
                <li><a href="../footer/datenschutz.html">Datenschutz</a></li>
            </ul>
        </nav>
        <p><img src="../../assets/img/studybox-logo-weiss.png"
            alt="StudyBox - Digitale Starterpakete für Studenten"
            width="80"></p>
    </footer>

</body>

</html>
